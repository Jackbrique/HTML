<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#0c0c0e"/>
  <!-- Outer ring -->
  <circle cx="256" cy="256" r="120" fill="none" stroke="rgba(200,180,150,0.18)" stroke-width="1"/>
  <!-- Inner ring -->
  <circle cx="256" cy="256" r="80" fill="none" stroke="rgba(200,180,150,0.1)" stroke-width="1"/>
  <!-- Core -->
  <circle cx="256" cy="256" r="24" fill="none" stroke="rgba(200,180,150,0.35)" stroke-width="1.2"/>
  <!-- Radial breath lines — expansion -->
  <line x1="256" y1="108" x2="256" y2="136" stroke="rgba(200,149,106,0.45)" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="256" y1="376" x2="256" y2="404" stroke="rgba(200,149,106,0.45)" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="108" y1="256" x2="136" y2="256" stroke="rgba(200,149,106,0.45)" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="376" y1="256" x2="404" y2="256" stroke="rgba(200,149,106,0.45)" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="151" y1="151" x2="171" y2="171" stroke="rgba(200,149,106,0.3)" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="341" y1="341" x2="361" y2="361" stroke="rgba(200,149,106,0.3)" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="361" y1="151" x2="341" y2="171" stroke="rgba(200,149,106,0.3)" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="171" y1="341" x2="151" y2="361" stroke="rgba(200,149,106,0.3)" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Ambient glow -->
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="rgba(180,150,110,0.08)"/>
    <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
  </radialGradient>
  <circle cx="256" cy="256" r="200" fill="url(#glow)"/>
</svg>
